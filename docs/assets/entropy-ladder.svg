<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Skill Heaven is the runtime that decides what is in your session. Skill Zero is the finished launcher: subtractive, it starts a harness clean (off, low, med). Heaven is the converge summon that curates the right few skills (slash skill-heaven). Hell is the exploratory summon that reaches for more capability (slash skill-hell; high, xhigh, max). Ultra is the future auto-switch across them (unratified).">
  <rect x="0" y="0" width="900" height="300" fill="#05060a"/>

  <!-- product banner -->
  <text x="450" y="42" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="20" font-weight="700" fill="#f7f8ff" text-anchor="middle" letter-spacing="4">SKILL HEAVEN</text>
  <text x="450" y="64" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="12" font-weight="400" fill="#8a8fb0" text-anchor="middle">the runtime that decides what enters your agent's session</text>

  <!-- Skill Zero (finished launcher, subtractive) -->
  <rect x="30" y="104" width="190" height="66" rx="9" fill="#0e1524" stroke="#37d6e0" stroke-width="1.75"/>
  <text x="125" y="132" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f7f8ff" text-anchor="middle" letter-spacing="1.5">SKILL ZERO</text>
  <text x="125" y="151" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#37d6e0" text-anchor="middle">the launcher · subtractive</text>
  <text x="125" y="192" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#6b6f88" text-anchor="middle">off · low · med</text>
  <text x="125" y="209" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#6b6f88" text-anchor="middle">start clean, at boot</text>

  <!-- Heaven (converge summon) -->
  <rect x="246" y="104" width="190" height="66" rx="9" fill="#0b1220" stroke="#7cc4ff" stroke-width="1.5"/>
  <text x="341" y="132" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="15" font-weight="700" fill="#f7f8ff" text-anchor="middle" letter-spacing="1.5">HEAVEN</text>
  <text x="341" y="151" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#7cc4ff" text-anchor="middle">converge summon</text>
  <text x="341" y="192" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#6b6f88" text-anchor="middle">/skill-heaven</text>
  <text x="341" y="209" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#6b6f88" text-anchor="middle">curate the right few</text>

  <!-- Hell (exploratory summon) -->
  <rect x="462" y="104" width="190" height="66" rx="9" fill="#1a0e12" stroke="#ff6a8b" stroke-width="1.75"/>
  <text x="557" y="132" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff0f3" text-anchor="middle" letter-spacing="1.5">HELL</text>
  <text x="557" y="151" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#ff6a8b" text-anchor="middle">explore summon</text>
  <text x="557" y="192" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#9a7580" text-anchor="middle">/skill-hell · high · xhigh · max</text>
  <text x="557" y="209" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#9a7580" text-anchor="middle">reach for more capability</text>

  <!-- Ultra (future auto-switch) -->
  <rect x="678" y="104" width="190" height="66" rx="9" fill="#0a0a0f" stroke="#9a9a97" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="773" y="132" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="15" font-weight="700" fill="#c9c9d4" text-anchor="middle" letter-spacing="1.5">ULTRA</text>
  <text x="773" y="151" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11.5" fill="#9a9a97" text-anchor="middle">auto-switch</text>
  <text x="773" y="192" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" fill="#6b6f88" text-anchor="middle">unratified</text>
  <text x="773" y="209" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#6b6f88" text-anchor="middle">governs Heaven ↔ Hell</text>

  <!-- axis -->
  <line x1="30" y1="244" x2="852" y2="244" stroke="#2b2d3a" stroke-width="1.5"/>
  <polygon points="852,244 842,239 842,249" fill="#2b2d3a"/>
  <text x="30" y="270" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="11" fill="#6b6f88" text-anchor="start">clean start</text>
  <text x="836" y="270" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="11" fill="#6b6f88" text-anchor="end">more capability</text>
  <text x="450" y="292" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#4f5372" text-anchor="middle">Skill Zero is the finished launcher today · Heaven / Hell / Ultra summon behavior is the HH-Index research, in the works</text>
</svg>
