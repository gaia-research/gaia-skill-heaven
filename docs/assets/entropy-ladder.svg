<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="612" viewBox="0 0 1060 612" role="img" aria-label="Skill Heaven's one line of seven rungs measures skill entropy — how much skill variety and volume enters a session. Zero is the human-led floor: a clean harness with nothing loaded, opened with /skill-zero. Heaven (low, med) is human-led and converges narrowly on the gap, opened with /skill-heaven. Hell (high, xhigh, max) is model-led and explores widely around it, opened with /skill-hell. Ultra is model-led and sits at the top of the line, picking the entropy for you gap by gap, opened with /skill-ultra. Every rung is reachable; nothing on the line refuses.">
