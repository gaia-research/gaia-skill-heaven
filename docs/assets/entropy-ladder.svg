<svg xmlns="http://www.w3.org/2000/svg" width="900" height="348" viewBox="0 0 900 348" role="img" aria-label="The skill-entropy ladder is one line of seven rungs measuring how much skill variety and volume enters a session: zero is the floor with no automatic summoning, Heaven (low, med) converges narrowly on the gap, Hell (high, xhigh, max) explores widely around it, and Ultra sits at the top of the line, picking the entropy for you, gap by gap. Every rung is reachable; nothing on the line refuses.">
