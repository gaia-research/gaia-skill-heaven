<svg xmlns="http://www.w3.org/2000/svg" width="900" height="348" viewBox="0 0 900 348" role="img" aria-label="The entropy ladder. Heaven holds off, low, and med (which equals native); it is served by slash skill-heaven and needs the Skill Zero launcher. Hell is additive and holds high (the default), xhigh, max, and ultra (unratified); it is served by slash skill-hell and needs only the plugin.">
<rect x="0" y="0" width="396.0" height="348" fill="#05060a"/>
<rect x="396.0" y="0" width="504.0" height="348" fill="#f4f4f2"/>
<text x="212.0" y="52.0" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="13" font-weight="700" fill="#f7f8ff" text-anchor="middle" letter-spacing="3.2">HEAVEN</text>
<text x="212.0" y="74.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#37d6e0" text-anchor="middle">subtractive</text>
<text x="212.0" y="94.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="400" fill="#6b6f88" text-anchor="middle">withholds what you already have</text>
<text x="634.0" y="52.0" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="13" font-weight="700" fill="#050505" text-anchor="middle" letter-spacing="3.2">HELL</text>
<text x="634.0" y="74.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="12" font-weight="600" fill="#050505" text-anchor="middle">additive</text>
<text x="634.0" y="94.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="400" fill="#6a6a68" text-anchor="middle">summons what you do not</text>
<rect x="56.0" y="168" width="96" height="46" rx="7" fill="#10121d" stroke="#2b2d3a" stroke-width="1.5"/>
<text x="104.0" y="197.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#f7f8ff" text-anchor="middle">off</text>
<text x="104.0" y="232.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" font-weight="400" fill="#6b6f88" text-anchor="middle">product-floor</text>
<rect x="164.0" y="159" width="96" height="46" rx="7" fill="#10121d" stroke="#2b2d3a" stroke-width="1.5"/>
<text x="212.0" y="188.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#f7f8ff" text-anchor="middle">low</text>
<text x="212.0" y="223.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" font-weight="400" fill="#6b6f88" text-anchor="middle">curated</text>
<rect x="272.0" y="150" width="96" height="46" rx="7" fill="#10121d" stroke="#2b2d3a" stroke-width="1.5"/>
<text x="320.0" y="179.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#f7f8ff" text-anchor="middle">med</text>
<text x="320.0" y="214.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" font-weight="400" fill="#37d6e0" text-anchor="middle">= native</text>
<rect x="424.0" y="141" width="96" height="46" rx="7" fill="#ffffff" stroke="#050505" stroke-width="2"/>
<text x="472.0" y="170.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#050505" text-anchor="middle">high</text>
<text x="472.0" y="205.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" font-weight="600" fill="#6a6a68" text-anchor="middle">default</text>
<rect x="532.0" y="132" width="96" height="46" rx="7" fill="#ffffff" stroke="#050505" stroke-width="1.5"/>
<text x="580.0" y="161.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#050505" text-anchor="middle">xhigh</text>
<rect x="640.0" y="123" width="96" height="46" rx="7" fill="#ffffff" stroke="#050505" stroke-width="1.5"/>
<text x="688.0" y="152.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#050505" text-anchor="middle">max</text>
<rect x="748.0" y="114" width="96" height="46" rx="7" fill="#f4f4f2" stroke="#9a9a97" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="796.0" y="143.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="17" font-weight="600" fill="#9a9a97" text-anchor="middle">ultra</text>
<text x="796.0" y="178.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="11" font-weight="400" fill="#9a9a97" text-anchor="middle">unratified</text>
<rect x="56.0" y="250" width="312" height="56" rx="9" fill="none" stroke="#37d6e0" stroke-width="1.5"/>
<text x="212.0" y="275.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="15" font-weight="600" fill="#f7f8ff" text-anchor="middle">/skill-heaven</text>
<text x="212.0" y="293.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="400" fill="#a9adc4" text-anchor="middle" letter-spacing="0.8">needs the LAUNCHER</text>
<rect x="424.0" y="250" width="420" height="56" rx="9" fill="none" stroke="#050505" stroke-width="1.5"/>
<text x="634.0" y="275.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="15" font-weight="600" fill="#050505" text-anchor="middle">/skill-hell</text>
<text x="634.0" y="293.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="400" fill="#6a6a68" text-anchor="middle" letter-spacing="0.8">needs only the PLUGIN</text>
<text x="212.0" y="330.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="11" font-weight="400" fill="#6b6f88" text-anchor="middle">a boot-time decision — a session cannot evict</text>
<text x="634.0" y="330.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="11" font-weight="400" fill="#6a6a68" text-anchor="middle">any live session — adding context always works</text>
</svg>
