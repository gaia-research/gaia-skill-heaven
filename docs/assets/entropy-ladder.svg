<text x="878.0" y="514.0" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="9" font-weight="700" fill="#f4f4f2" text-anchor="start" letter-spacing="1.2">FLEET OPERATORS</text>
<text x="530.0" y="580.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="400" fill="#a9adc4" text-anchor="middle">Nothing on the line refuses. No rung carries a count, and no summon is capped.</text>
<text x="530.0" y="598.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="10" font-weight="400" fill="#6b6f88" text-anchor="middle">Heaven's representative rung (low) and Hell's (high) stay PROVISIONAL  ·  docs/LADDER-FLOW.md</text>
