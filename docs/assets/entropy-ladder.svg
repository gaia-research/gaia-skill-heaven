<text x="266.0" y="52.0" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="13" font-weight="700" fill="#f7f8ff" text-anchor="middle" letter-spacing="3.2">HEAVEN</text>
<text x="266.0" y="74.0" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="12" font-weight="600" fill="#37d6e0" text-anchor="middle">converge</text>
<text x="266.0" y="94.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="400" fill="#6b6f88" text-anchor="middle">narrows onto the gap</text>
