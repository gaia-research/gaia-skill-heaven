<text x="530.0" y="78.0" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="24" font-weight="700" fill="#f7f8ff" text-anchor="middle">Decide how much skill enters the session.</text>
<text x="530.0" y="102.0" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="400" fill="#a9adc4" text-anchor="middle">/summon puts one skill into context — one session, nothing installed. The line below sets how far the agent reaches.</text>
