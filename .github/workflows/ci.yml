name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # contract: wrangler-adjacent tooling + workspaces assume >=22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm -w @gaia-skill-heaven/site run build
      - run: npm test

      # PR4: the summon MCP server is bundled and its output is COMMITTED
      # (plugins/skill-heaven/mcp/skill-summon.mjs), so an installed user needs
      # no npx, no sibling checkout, no external binary. esbuild output can
      # vary by version, so esbuild is pinned to an exact version (no `^`) in
      # root package.json — this rebuild is deterministic given that pin. A
      # diff here means someone edited the source without rebuilding, or
      # committed a bundle produced by a different esbuild version.
      - name: MCP bundle is up to date
        run: |
          npm run build:mcp
          git diff --exit-code -- plugins/skill-heaven/mcp/

      # The console mod cannot import packages/status at run time (a mod has no
      # Node and reads only its own folder), so it carries a committed bundle of
      # the one status model. A diff means the model changed without a rebuild.
      - name: Status model bundle is up to date
        run: |
          npm run build:status
          git diff --exit-code -- plugins/skill-heaven-console/hooks/status-model.mjs

      - name: Portable console bundles are up to date
        run: npm run build:console -- --check

      - name: Installer profile contract bundle is up to date
        run: |
          npm run build:profiles
          git diff --exit-code -- scripts/install-profile.mjs

      # The committed skill index is the runtime's only read path (SPEC §2.2),
      # and it is a deterministic function of the committed corpus snapshot.
      # A diff here means someone edited the snapshot or the builder without
      # rebuilding — which would ship a plugin whose index does not match the
      # corpus it claims to index.
      - name: Skill index is up to date
        run: npx tsx packages/core/scripts/build-skill-index.ts --check

      # The plugin is the shipped artifact: validate its manifest with the real
      # Claude Code CLI, not just our own tests. `plugin validate` is a static
      # manifest check — it starts no session and needs no credentials.
      - name: Validate the plugin manifest
        run: npx -y @anthropic-ai/claude-code@latest plugin validate ./plugins/skill-heaven

      # The optional console is a Mods plugin (function hooks, early-access
      # API). `plugin validate` reads its hooks module the way the engine will
      # and reports anything the engine would refuse — still static, no session.
      - name: Validate the console mod
        run: npx -y @anthropic-ai/claude-code@latest plugin validate ./plugins/skill-heaven-console

      # D6 cross-repo gate: a record emitted by core must pass gaia-research's
      # ledger validator (the validator never moves — it stays upstream, D6).
      - name: Checkout gaia-research (upstream ledger validator)
        uses: actions/checkout@v4
        with:
          repository: gaia-research/gaia-research
          ref: main # D6 validator-of-record lives on main; pin for reproducibility
          path: .gaia-research # public repo; no token needed
      - name: Emit a core record and validate it upstream (D6)
        run: |
          npx tsx packages/core/scripts/emit-sample-record.ts > rec.jsonl
          cat rec.jsonl
          npx tsx .gaia-research/scripts/hell-heaven-bench/ledger.ts validate --file rec.jsonl
