name: Harness compat

# Credential-free harness compatibility checks (#35): Claude Code, pi, codex, grok, agy. This
# does NOT run an authenticated session and proves nothing about session-level
# behaviour; see docs/COMPAT-MATRIX.md for exactly what each cell checks and at which
# evidence level (structural / dry-run / session). There is no session cell: CI holds
# no harness credentials. hermes has no cell because there is no verified pinned install
# route that works without building external source (docs/COMPAT-MATRIX.md).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly, to notice `latest` drifting
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude-code:
    name: claude-code ${{ matrix.version }}${{ matrix.pinned && ' (pinned, blocking)' || ' (informational)' }}
    runs-on: ubuntu-latest
    # `latest` is informational: a failure there is a signal to re-probe, not a
    # red build. The pinned probe version is blocking.
    continue-on-error: ${{ !matrix.pinned }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '2.1.318' # pinned probe version; kept equal to RECEIPT.claude by test/compat-matrix.test.ts
            pinned: true
          - version: 'latest'
            pinned: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Claude Code ${{ matrix.version }}
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.version }}
      - name: claude --version
        run: claude --version
      - name: Installed version equals the pin
        if: ${{ matrix.pinned }}
        run: test "$(claude --version | awk '{print $1}')" = "${{ matrix.version }}"
      - name: plugin validate (core plugin)
        run: claude plugin validate ./plugins/skill-heaven
      - name: plugin validate (console mod)
        run: claude plugin validate ./plugins/skill-heaven-console
      - name: claude-zero door composition (--print, no session)
        run: node packages/claude-zero/bin/claude-zero.mjs --print > /dev/null
      - name: Door composition tests (no auth, no session)
        run: npx vitest run packages/claude-zero packages/core/test/door-ladder.test.ts test/compat-matrix.test.ts

  pi:
    name: pi ${{ matrix.version }}${{ matrix.pinned && ' (pinned, blocking)' || ' (informational)' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.pinned }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.5.0' # pinned; kept equal to the pi version in docs/evidence/linux-41/PROBE.md by test/compat-matrix.test.ts
            pinned: true
          - version: 'latest'
            pinned: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pi ${{ matrix.version }}
        run: npm install -g @earendil-works/pi-coding-agent@${{ matrix.version }}
      - name: pi checks (version pin, door --print, door flags vs pi --help)
        if: ${{ matrix.pinned }}
        run: node scripts/compat-check.mjs pi --pin ${{ matrix.version }}
      - name: pi checks (latest, no pin)
        if: ${{ !matrix.pinned }}
        run: node scripts/compat-check.mjs pi

  codex:
    name: codex ${{ matrix.version }}${{ matrix.pinned && ' (pinned, blocking)' || ' (informational)' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.pinned }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '0.166.0' # pinned; kept equal to the codex version in docs/evidence/linux-41/PROBE.md by test/compat-matrix.test.ts
            pinned: true
          - version: 'latest'
            pinned: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install codex ${{ matrix.version }}
        run: npm install -g @openai/codex@${{ matrix.version }}
      - name: codex checks (version pin, door --print, app-server skills/list)
        if: ${{ matrix.pinned }}
        run: node scripts/compat-check.mjs codex --pin ${{ matrix.version }}
      - name: codex checks (latest, no pin)
        if: ${{ !matrix.pinned }}
        run: node scripts/compat-check.mjs codex

  grok:
    name: grok ${{ matrix.version }}${{ matrix.pinned && ' (pinned, blocking)' || ' (informational)' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.pinned }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.0.77' # pinned; the version in packages/grok-zero/PROBE.md, installed from npm and observed on Linux 2026-11-06
            pinned: true
          - version: 'latest'
            pinned: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install grok ${{ matrix.version }}
        run: npm install -g @xai-official/grok@${{ matrix.version }}
      - name: grok checks (version pin, door --print, door flags accepted by grok)
        if: ${{ matrix.pinned }}
        run: node scripts/compat-check.mjs grok --pin ${{ matrix.version }}
      - name: grok checks (latest, no pin)
        if: ${{ !matrix.pinned }}
        run: node scripts/compat-check.mjs grok

  agy:
    name: agy ${{ matrix.version }}${{ matrix.pinned && ' (pinned, blocking)' || ' (informational)' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.pinned }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.5.2' # pinned release tarball; sha512 below is the vendor manifest value observed 2026-11-06
            pinned: true
            url: 'https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.2-4951595792859136/linux-x64/cli_linux_x64.tar.gz'
            sha512: 'aa876c0813572efaf85ed47983cc937414705d40490cbdb54f6e255656a4f8744ae38e457823e924fa8270b348124e0521d3cda3fec6824bb2d14b98a7a05baa'
          - version: 'latest'
            pinned: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install agy (pinned tarball, sha512 verified)
        if: ${{ matrix.pinned }}
        run: |
          mkdir -p "$RUNNER_TEMP/agy"
          curl -fsSL -o "$RUNNER_TEMP/agy.tgz" "${{ matrix.url }}"
          echo "${{ matrix.sha512 }}  $RUNNER_TEMP/agy.tgz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/agy.tgz" -C "$RUNNER_TEMP/agy"
          mv "$RUNNER_TEMP/agy/antigravity" "$RUNNER_TEMP/agy/agy"
          echo "$RUNNER_TEMP/agy" >> "$GITHUB_PATH"
      - name: Install agy (latest, per the vendor manifest, sha512 verified)
        if: ${{ !matrix.pinned }}
        run: |
          m=$(curl -fsSL https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json)
          url=$(echo "$m" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).url)')
          sha=$(echo "$m" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).sha512)')
          mkdir -p "$RUNNER_TEMP/agy"
          curl -fsSL -o "$RUNNER_TEMP/agy.tgz" "$url"
          echo "$sha  $RUNNER_TEMP/agy.tgz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/agy.tgz" -C "$RUNNER_TEMP/agy"
          mv "$RUNNER_TEMP/agy/antigravity" "$RUNNER_TEMP/agy/agy"
          echo "$RUNNER_TEMP/agy" >> "$GITHUB_PATH"
      - name: agy checks (version pin, door --print, door flags vs agy --help)
        if: ${{ matrix.pinned }}
        run: node scripts/compat-check.mjs agy --pin ${{ matrix.version }}
      - name: agy checks (latest, no pin)
        if: ${{ !matrix.pinned }}
        run: node scripts/compat-check.mjs agy
